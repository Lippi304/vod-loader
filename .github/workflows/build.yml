name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # nacheinander, damit beide Jobs in dasselbe Release schreiben
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            files: dist/*.dmg
          - os: windows-latest
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Releases zählen nicht zum Artifact-Speicherkontingent
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VOD Loader 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
