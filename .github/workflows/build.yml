name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # nacheinander, damit beide Jobs in dasselbe Release schreiben
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            files: dist/*.dmg
          - os: windows-latest
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          # Zertifikat und Apple-Zugang gibt es nur auf dem Mac; Windows bekommt sie nie zu sehen.
          # Mit Developer-ID-Zertifikat + APPLE_* notarisiert electron-builder automatisch.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: R7AGU84UX7
      # Ohne Secrets baut electron-builder still eine unsignierte App: hier lieber laut scheitern.
      - name: Signatur und Notarisierung prüfen
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d dist/mac*/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      # Releases zählen nicht zum Artifact-Speicherkontingent
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VOD Loader 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
