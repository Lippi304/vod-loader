name: Build

# Pushing a version tag (e.g. v1.2.0) builds and publishes a release; the tag has to match
# the version in package.json. "Run workflow" only builds and verifies, without a release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # one after another, so both jobs write to the same release
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            files: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
          - os: windows-latest
            files: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run dist
        env:
          # The certificate and Apple credentials only exist on the Mac; Windows never sees them.
          # With a Developer ID certificate + APPLE_*, electron-builder notarizes automatically.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: R7AGU84UX7
      # Without secrets electron-builder silently builds an unsigned app: fail loudly instead.
      - name: Verify signature and notarization
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d dist/mac*/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      # The apps find updates through latest*.yml. GitHub renames asset names with spaces,
      # which would leave these files pointing at files that don't exist.
      - name: Check that the update files point at existing files
        shell: bash
        run: |
          for f in dist/latest*.yml; do
            for u in $(sed -n -E 's/^ *(- )?url: *//p' "$f"); do
              test -f "dist/$u" || { echo "$f points to a missing file: $u"; exit 1; }
            done
          done
      # Releases don't count towards the artifact storage quota
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: VOD Loader ${{ github.ref_name }}
          make_latest: true
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
