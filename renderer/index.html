<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'" />
  <title>VOD Loader</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="titlebar"></div>

  <main>
    <!-- Setup -->
    <section id="view-setup" class="view center">
      <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg></div>
      <h2>One moment …</h2>
      <p class="muted">Setting up VOD Loader for the first time.</p>
      <div class="bar"><div class="bar-fill" id="setup-fill"></div></div>
    </section>

    <!-- Start -->
    <section id="view-start" class="view center">
      <div class="app-icon"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg></div>
      <h1>VOD Loader</h1>
      <p class="muted">Paste a Twitch VOD link or type a channel name.</p>
      <form id="url-form" class="field" autocomplete="off">
        <input id="url" type="text" spellcheck="false" placeholder="twitch.tv/videos/… or a channel" />
        <button type="submit" id="go" class="field-btn" aria-label="Continue">
          <svg viewBox="0 0 24 24"><path d="M5 12h14m0 0l-6-6m6 6l-6 6"/></svg>
        </button>
      </form>
      <p id="start-error" class="error" hidden></p>
      <button id="to-queue" class="btn plain" hidden>View downloads</button>
    </section>

    <!-- VOD found -->
    <section id="view-info" class="view">
      <div class="card">
        <div class="thumb"><img id="thumb" alt="" /><span id="duration" class="badge"></span></div>
        <div class="card-body">
          <h3 id="title"></h3>
          <p id="meta" class="muted small"></p>
        </div>
      </div>

      <div class="group">
        <label class="row">
          <span>Quality</span>
          <span class="select-wrap"><select id="quality"></select></span>
        </label>
        <label class="row">
          <span>Section only</span>
          <input type="checkbox" id="section-toggle" class="switch" />
        </label>
        <div id="section-rows" class="collapse"><div>
          <label class="row">
            <span>From</span>
            <input id="start" class="time" type="text" placeholder="0:00:00" inputmode="numeric" />
          </label>
          <label class="row">
            <span>To</span>
            <input id="end" class="time" type="text" placeholder="0:00:00" inputmode="numeric" />
          </label>
        </div></div>
        <button type="button" class="row link-row" id="dir-btn">
          <span>Save to</span>
          <span class="value"><span id="dir-name">Downloads</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
        </button>
      </div>

      <p id="info-error" class="error" hidden></p>

      <div class="actions">
        <button id="download" class="btn primary">Download</button>
        <button id="back" class="btn plain">Another VOD</button>
      </div>
    </section>

    <!-- Channel: recent VODs to pick from -->
    <section id="view-channel" class="view">
      <div class="ch-head">
        <div class="ch-title">
          <h2 id="ch-name"></h2>
          <p id="ch-sub" class="muted small"></p>
        </div>
        <div class="ch-tools">
          <div class="seg" role="group" aria-label="Layout">
            <button type="button" id="lay-grid" class="seg-btn" aria-label="Grid" title="Grid">
              <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
            </button>
            <button type="button" id="lay-list" class="seg-btn" aria-label="List" title="List">
              <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
          </div>
          <button type="button" id="ch-all" class="link-btn">Select all</button>
        </div>
      </div>

      <div class="ch-scroll">
        <div id="ch-grid" class="ch-grid" data-layout="grid"></div>
        <p id="ch-empty" class="muted ch-empty" hidden>No VODs from the last 14 days. Check the channel name, or the channel may not keep past broadcasts.</p>
      </div>

      <div class="group">
        <label class="row">
          <span>Quality</span>
          <span id="ch-quality-wrap" class="select-wrap"><select id="ch-quality"></select></span>
          <span class="ch-hint">Set on each VOD</span>
        </label>
        <label class="row">
          <span>Same quality for all</span>
          <input type="checkbox" id="ch-same" class="switch" checked />
        </label>
        <button type="button" class="row link-row" id="ch-dir-btn">
          <span>Save to</span>
          <span class="value"><span id="ch-dir-name">Downloads</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
        </button>
      </div>

      <p id="ch-error" class="error" hidden></p>

      <div class="actions">
        <button id="ch-download" class="btn primary" disabled>Download</button>
        <button id="ch-back" class="btn plain">Another VOD or channel</button>
      </div>
    </section>

    <!-- Downloads / queue -->
    <section id="view-queue" class="view">
      <div class="queue-head">
        <h2 id="q-title">Downloads</h2>
        <p id="q-sub" class="muted small"></p>
      </div>
      <ul id="q-list" class="group q-list"></ul>
      <div class="actions">
        <button id="q-add" class="btn primary">Add another VOD</button>
        <button id="q-folder" class="btn plain">Show in Finder</button>
      </div>
    </section>
  </main>

  <div id="update-bar" class="update-bar" hidden>
    <span id="update-text"></span>
    <button type="button" id="update-later" class="link-btn">Later</button>
    <button type="button" id="update-restart" class="update-btn">Restart</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
